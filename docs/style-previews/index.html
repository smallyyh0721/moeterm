<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>界面风格预览</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      main { max-width: 1320px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 20px; }
      p { color: #bbb; line-height: 1.6; }
      figure { margin: 28px 0; }
      img { width: 100%; border: 1px solid #333; }
      figcaption { margin-bottom: 8px; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>界面风格预览</h1>
      <p>名称都是 kittyTerm，标题栏图标是白色曼基康猫。橙黑的大图是银发角色，暖棕的大图是狗头。古典绿没有主题画像。</p>
      <figure>
        <figcaption>橙黑 · kittyTerm</figcaption>
        <img src="zzz.png" alt="橙黑风格预览" />
      </figure>
      <figure>
        <figcaption>暖棕 · kittyTerm · 狗头</figcaption>
        <img src="fff.png" alt="暖棕风格预览" />
      </figure>
      <figure>
        <figcaption>古典绿 · kittyTerm</figcaption>
        <img src="current.png" alt="古典绿风格预览" />
      </figure>
    </main>
  </body>
</html>
